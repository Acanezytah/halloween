name: Deploy to Render

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check that the app loads
        run: python -c "import app"

  deploy:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        env:
          SECRET_WEBHOOK: ${{ secrets.SECRET_WEBHOOK }}
        run: |
          if [ -z "$SECRET_WEBHOOK" ]; then
            echo "Falta el secreto SECRET_WEBHOOK"
            exit 1
          fi
          curl -fsS -X POST "$SECRET_WEBHOOK"
